# HMC Solar - iOS build workflows.
# Unsigned validation and signed IPA builds.
# iOS serial verification remains disabled until
# server-side Apple App Attest verification is operational.
workflows:
  hmc-ios-validation:
    name: HMC Solar - iOS unsigned validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate Flutter native project
        script: |
          cd flutter
          python3 prepare_native.py
      - name: Resolve Flutter packages
        script: |
          cd flutter
          flutter pub get
      - name: Generate launcher icons
        script: |
          cd flutter
          dart run flutter_launcher_icons
      - name: Analyze Dart and Flutter code
        script: |
          cd flutter
          flutter analyze
      - name: Run unit and widget tests
        script: |
          cd flutter
          flutter test
      - name: Build unsigned iOS application
        script: |
          cd flutter
          flutter build ios --release --no-codesign --dart-define=IOS_ATTEST_ENABLED=false
    artifacts:
      - flutter/build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log


  hmc-ios-signed:
    name: HMC Solar - iOS signed IPA
    integrations:
      app_store_connect: HMC Solar Codemagic
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
      ios_signing:
        certificates:
          - HMC_Solar_Distribution
        provisioning_profiles:
          - HMC_Solar_AppStore_Profile
    scripts:
      - name: Generate Flutter native project
        script: |
          cd flutter
          python3 prepare_native.py
      - name: Resolve Flutter packages
        script: |
          cd flutter
          flutter pub get
      - name: Generate launcher icons
        script: |
          cd flutter
          dart run flutter_launcher_icons
      - name: Analyze and test
        script: |
          cd flutter
          flutter analyze
          flutter test
      - name: Set up iOS signing
        script: |
          cd flutter
          xcode-project use-profiles
      - name: Build signed iOS IPA
        script: |
          cd flutter
          flutter build ipa --release \
            --dart-define=IOS_ATTEST_ENABLED=false \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - flutter/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      publishing:
      app_store_connect:
        auth: integration

