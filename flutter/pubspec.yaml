name: hmc_solar_verify
description: Native HMC Solar customer serial verification app for Android and iOS.
publish_to: none
version: 0.3.2+8

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  app_attest: ^0.2.1
  crypto: ^3.0.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/hmc_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
